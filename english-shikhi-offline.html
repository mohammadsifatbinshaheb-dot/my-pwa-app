const today=new Date().toDateString();if(S.day!==today){S.day=today;S.td=0}
const save=()=>{try{localStorage.setItem('es2',JSON.stringify(S))}catch(e){}};

function head(){const l=lvOf(S.xp),lo=xpFor(l),n=xpFor(l+1);
const t=TH[S.th]||TH[0];document.documentElement.style.setProperty('--hd',t[1]);document.documentElement.style.setProperty('--acc',t[2]);
$('#ln').textContent=AV[S.av]+' লেভেল '+l+' · '+ttl(l);$('#xp').textContent=S.xp;
$('#lb').style.width=(S.xp-lo)/(n-lo)*100+'%';
$('#dg').textContent='পরের লেভেলে আরও '+(n-S.xp)+' XP · আজকের লক্ষ্য: '+Math.min(S.td,10)+'/10'+(S.td>=10?' ✅':'');
if(l>S.lv)up(l)}
function up(l){let g=0,msg='';for(let k=S.lv+1;k<=l;k++){g+=10*k}S.lv=l;S.gem+=g;
const ai=Math.min(l-1,AV.length-1);msg+=`<div>🎁 নতুন অবতার: <b style="font-size:26px">${AV[ai]}</b></div><div>💎 +${g} জেম (মোট ${S.gem})</div>`;
if(l>1&&l%5===1&&(l-1)/5<TH.length)msg+=`<div>🎨 নতুন থিম আনলক: <b>${TH[(l-1)/5][0]}</b></div>`;
if(l>1&&(l-1)%3===0)msg+=`<div>🏅 নতুন উপাধি: <b>${ttl(l)}</b></div>`;
S.av=ai;save();const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="bx"><div style="font-size:54px">🎉</div><h2>লেভেল ${l}!</h2>${msg}<button class="btn">দারুণ!</button></div>`;o.onclick=()=>o.remove();document.body.appendChild(o);say('Level up')}
function setAv(i){S.av=i;head();save();me()}
function setTh(i){S.th=i;head();save();me()}
const pct=i=>Math.round(C[i][2].filter((_,j)=>S.m[i+'-'+j]).length/C[i][2].length*100);
const nav=t=>{document.querySelectorAll('#nv button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));({h:home,p:()=>play(ALL),s:speak,t:talk,m:me})[t]();scrollTo(0,0)};
$('#nv').onclick=e=>{const b=e.target.closest('button');if(b)nav(b.dataset.t)};
function home(){$('#v').innerHTML='<h2>'+C.length+'টি চ্যাপ্টার</h2><div class="grid">'+C.map((c,i)=>`<button class="ch" onclick="chap(${i})"><span style="font-size:26px">${c[1]}</span><b>${c[0]}</b><small>${pct(i)}% শেখা</small><div class="bar"><i style="width:${pct(i)}%"></i></div></button>`).join('')+'</div>'}
function chap(i){$('#v').innerHTML=`<button class="back" onclick="home()">← সব চ্যাপ্টার</button><h2>${C[i][1]} ${C[i][0]}</h2>`+ALL.filter(x=>x.c===i).map(x=>`<div class="card row"><div><div class="en">${S.m[x.id]?'✅ ':''}${x.e}</div><div class="mute">${x.b}</div></div><button class="ic" aria-label="শুনি" onclick="say('${x.e}')">🔊</button></div>`).join('')+`<button class="btn" onclick="play(ALL.filter(x=>x.c===${i}))">এই চ্যাপ্টারের কুইজ খেলি</button>`}
let pool,cur,mode='r',busy=0;
function play(p){pool=p;$('#v').innerHTML=`<div class="card"><div class="row"><span class="mute" id="pm"></span><button class="btn alt" style="width:auto;margin:0;padding:6px 12px" onclick="mode=mode==='r'?'l':'r';nq()">মোড বদলাই</button></div><div class="q" id="gq"></div><div id="go"></div><div class="msg" id="gm"></div><button class="btn" id="gn" style="display:none" onclick="nq()">পরের প্রশ্ন</button></div>`;nq()}
function nq(){busy=0;const miss=pool.filter(x=>S.ms[x.id]);cur=miss.length&&Math.random()<.4?pick(miss):pick(pool);
const o=[cur];while(o.length<4){const x=pick(ALL);if(!o.includes(x))o.push(x)}o.sort(()=>Math.random()-.5);
$('#pm').textContent=mode==='r'?'📖 পড়ে বেছে নাও':'🎧 শুনে বেছে নাও';
$('#gq').innerHTML=mode==='r'?cur.b:'<button class="ic" onclick="say(cur.e)">🔊</button> শুনে অর্থ বেছে নাও';if(mode==='l')say(cur.e);
$('#gm').textContent='';$('#gn').style.display='none';$('#go').innerHTML='';
o.forEach(x=>{const b=document.createElement('button');b.className='opt';b.textContent=mode==='r'?x.e:x.b;b.onclick=()=>ans(b,x);$('#go').appendChild(b)})}
function ans(b,x){if(busy)return;busy=1;const ok=x===cur;
if(ok){b.classList.add('ok');S.xp+=10;S.st++;S.td++;S.bs=Math.max(S.bs,S.st);S.m[cur.id]=1;delete S.ms[cur.id];$('#gm').textContent='✅ সঠিক! +10 XP';say(cur.e)}
else{b.classList.add('no');S.st=0;S.ms[cur.id]=1;$('#gm').textContent='❌ সঠিক উত্তর: '+(mode==='r'?cur.e:cur.b);[...$('#go').children].forEach(c=>{if(c.textContent===(mode==='r'?cur.e:cur.b))c.classList.add('ok')})}
head();save();$('#gn').style.display='block'}
let sc;
function speak(){$('#v').innerHTML=`<div class="card"><div class="mute">শুনে বলো</div><div class="q" id="sq"></div><div class="mute" id="sb"></div><div class="row" style="margin-top:12px;gap:8px"><button class="btn" style="margin:0" onclick="say(sc.e)">🔊 শুনি</button><button class="btn" style="margin:0;background:var(--acc);color:#2b1d00" onclick="mic()">🎤 বলি</button></div><div class="msg" id="sr"></div><button class="btn alt" onclick="ns()">পরের বাক্য</button></div>`;ns()}
function ns(){sc=pick(ALL);$('#sq').textContent=sc.e;$('#sb').textContent=sc.b;$('#sr').textContent=''}
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('#sr').textContent='এই ব্রাউজারে মাইক চলে না। Chrome ব্যবহার করুন।';return}
const r=new R();r.lang='en-US';$('#sr').textContent='🎤 শুনছি… বলো';
r.onresult=e=>{const f=t=>t.toLowerCase().replace(/[^a-z ]/g,'').split(' ').filter(Boolean),h=f(e.results[0][0].transcript),w=f(sc.e),p=Math.round(w.filter(x=>h.includes(x)).length/w.length*100);
$('#sr').textContent=(p>=80?'🎉 দারুণ! ':'আবার চেষ্টা করো। ')+p+'% মিলেছে';if(p>=80){S.xp+=15;S.sp++;head();save()}};
r.onerror=()=>{$('#sr').textContent='মাইকের অনুমতি দিয়ে আবার চেষ্টা করুন।'};try{r.start()}catch(e){}}
function me(){const done=C.filter((_,i)=>pct(i)===100).length,B=[["🔥","৩ ধারা সঠিক",S.bs>=3],["⭐","১০০ XP",S.xp>=100],["📘","১ চ্যাপ্টার শেষ",done>=1],["🎤","প্রথম বলা",S.sp>=1],["🏆","৫ চ্যাপ্টার শেষ",done>=5],["💎","১০০০ XP",S.xp>=1000]];
$('#v').innerHTML=`<h2>আমার অগ্রগতি</h2><div class="card"><div class="row"><span>শেখা বাক্য</span><b>${Object.keys(S.m).length}/${ALL.length}</b></div><div class="row"><span>সর্বোচ্চ ধারা</span><b>🔥 ${S.bs}</b></div><div class="row"><span>শেষ করা চ্যাপ্টার</span><b>${done}/${C.length}</b></div></div><h2>ব্যাজ</h2><div class="badges">${B.map(b=>`<span class="bd ${b[2]?'':'off'}">${b[0]} ${b[1]}</span>`).join('')}</div><h2 style="margin-top:20px">🎁 আমার রিওয়ার্ড (💎 ${S.gem})</h2><div class="card"><div class="mute">অবতার বেছে নাও</div><div class="av">${AV.slice(0,Math.min(lvOf(S.xp),AV.length)).map((a,i)=>`<button class="${i===S.av?'on':''}" onclick="setAv(${i})">${a}</button>`).join('')}</div><div class="mute" style="margin-top:10px">থিম (প্রতি ৫ লেভেলে নতুন)</div><div class="av">${TH.slice(0,Math.min(TH.length,1+Math.floor((lvOf(S.xp)-1)/5))).map((t,i)=>`<button class="${i===S.th?'on':''}" style="font-size:14px;width:auto;padding:0 12px" onclick="setTh(${i})">${t[0]}</button>`).join('')}</div></div><h2 style="margin-top:20px">অ্যাপ সম্পর্কে</h2><div class="card"><b>English Shikhi</b> — বাংলাভাষীদের জন্য সহজ ইংরেজি শেখার অ্যাপ। বাক্য শুনুন, কুইজ খেলুন, উচ্চারণ প্র্যাকটিস করুন।<br><span class="mute">তৈরি করেছেন: <b>Sifat Uddin</b> · সংস্করণ 3.4</span></div><div class="card"><b>📲 ফোনে অ্যাপ হিসেবে রাখুন</b><div class="mute">ইনস্টল করলে ইন্টারনেট ছাড়াও চলবে।</div><button class="btn" onclick="inst()">ইনস্টল করুন</button><button class="btn alt" onclick="sh()">🔗 বন্ধুকে শেয়ার করুন</button></div><button class="btn alt" onclick="pv()">গোপনীয়তা নীতি</button><button class="btn alt" onclick="if(confirm('সব অগ্রগতি মুছে ফেলবেন?')){S={xp:0,st:0,bs:0,m:{},ms:{},day:today,td:0,sp:0,lv:1,av:0,th:0,gem:0};save();head();me()}">অগ্রগতি রিসেট</button>`}
function pv(){$('#v').innerHTML=`<button class="back" onclick="me()">← ফিরে যান</button><h2>গোপনীয়তা নীতি</h2><div class="card">• এই অ্যাপ আপনার নাম, ইমেইল বা অন্য কোনো ব্যক্তিগত তথ্য সংগ্রহ করে না।<br>• আপনার XP ও অগ্রগতি শুধু আপনার ডিভাইসে সংরক্ষিত থাকে, কোথাও পাঠানো হয় না।<br>• "বলা" ফিচারে মাইক ব্যবহার হয়। আপনার ব্রাউজারের স্পিচ সার্ভিস (যেমন Google) কথা চিনতে অডিও প্রসেস করতে পারে; অ্যাপ নিজে কোনো অডিও জমা রাখে না।<br>• এই সংস্করণে কোনো বিজ্ঞাপন বা ট্র্যাকিং নেই।<br>• প্রশ্ন থাকলে ডেভেলপার Sifat Uddin-এর সাথে যোগাযোগ করুন।</div>`}
const DL=[["পরিচয়",["A|What is your name?","B|My name is Rafi.","A|Where do you live?","B|I live in Dhaka.","A|How are you?","B|I am fine."]],
["রেস্টুরেন্টে",["A|Do you have coffee here?","B|Yes, we do.","A|How much is a burger?","B|It is one hundred taka.","A|I want to eat a burger today.","B|Please sit here."]],
["স্কুল",["A|Do you go to school every day?","B|Yes, I go to school every day.","A|Do you have an exam tomorrow?","B|Yes, I have to study now.","A|Can you speak English?","B|I can speak a little English."]],
["স্বাস্থ্য",["A|Are you sick?","B|Yes, I am sick.","A|You should go to the doctor.","B|I should take my medicine.","A|You should take rest now.","B|Thank you."]],
["পছন্দ",["A|What do you like?","B|I like ice cream.","A|Do you like to watch TV?","B|Yes, I like to watch TV.","A|What do you want to be?","B|I want to be a doctor."]]];
const TP=[["আমার প্রতিদিনের কাজ","I wake up in the morning. I eat rice. I go to school."],["আমার পরিবার","This is my mother. I love my family."],["আমার পছন্দ","I like ice cream. I like to talk to my friends."],["আমার স্বপ্ন","I want to be a doctor. I will learn English."],["গতকাল কী করেছি","I ate rice yesterday. I played football."]];
let di=0,ft=null,fsec=0,frec=null,fx='';
function inv(k){const t='আমার সাথে ইংরেজি প্র্যাকটিস করো! English Shikhi অ্যাপ: '+location.href;
if(k==='w')window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
else if(navigator.share)navigator.share({title:'English Shikhi',text:t}).catch(()=>{});else{try{navigator.clipboard.writeText(t);alert('কপি হয়েছে, এখন যেকোনো অ্যাপে পেস্ট করুন')}catch(e){alert(t)}}}
function talk(){const d=DL[di];
$('#v').innerHTML=`<h2>🤝 বন্ধুর সাথে প্র্যাকটিস</h2><div class="card"><div class="mute">বন্ধুকে ডেকে WhatsApp বা Messenger-এ ফ্রি ভয়েস কল করে নিচের কথোপকথন প্র্যাকটিস করুন।</div><button class="btn" onclick="inv('w')">WhatsApp-এ বন্ধুকে ডাকুন</button><button class="btn alt" onclick="inv('s')">অন্য অ্যাপে শেয়ার</button></div>
<h2>🗣️ কথোপকথন: ${d[0]}</h2><div class="card">${d[1].map((l,j)=>`<div class="row" style="margin-bottom:8px"><div><b>${l[0]}:</b> ${l.slice(2)}</div><button class="ic" style="width:36px;height:36px;font-size:15px" onclick="say(DL[${di}][1][${j}].slice(2))">🔊</button></div>`).join('')}<div class="mute">একজন A, আরেকজন B হয়ে বলুন, তারপর ভূমিকা বদলান।</div><button class="btn alt" onclick="di=(di+1)%DL.length;talk()">পরের কথোপকথন</button></div>
<h2>⏱️ ফ্রি কথা (৬০ সেকেন্ড)</h2><div class="card"><div class="q" id="ftp"></div><div class="mute" id="fth"></div><div class="row" style="margin-top:8px"><b id="ftm">60</b><span class="mute">সেকেন্ড</span></div><div class="msg" id="ftx"></div><button class="btn" id="ftb" onclick="startFT()">🎤 শুরু করুন</button><button class="btn alt" onclick="newFT()">অন্য টপিক</button></div>`;newFT()}
function newFT(){ft=pick(TP);$('#ftp').textContent=ft[0];$('#fth').textContent='যেমন: '+ft[1];$('#ftx').textContent='';$('#ftm').textContent='60'}
function startFT(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('#ftx').textContent='এই ব্রাউজারে মাইক চলে না। Chrome ব্যবহার করুন, বা জোরে বলে প্র্যাকটিস করুন।';return}
fsec=60;fx='';const r=frec=new R();r.lang='en-US';r.continuous=true;r.interimResults=true;
r.onresult=e=>{fx='';for(let i=0;i<e.results.length;i++)fx+=e.results[i][0].transcript+' ';$('#ftx').textContent=fx};
r.onend=()=>{if(fsec>0)try{r.start()}catch(e){}};r.onerror=()=>{};try{r.start()}catch(e){}
const iv=setInterval(()=>{fsec--;const m=$('#ftm');if(m)m.textContent=Math.max(fsec,0);
if(fsec<=0){clearInterval(iv);try{r.stop()}catch(e){}const w=fx.trim().split(/\s+/).filter(Boolean).length;
const x=$('#ftx');if(x)x.textContent='মোট '+w+' টা শব্দ বলেছেন। '+(w>=15?'🎉 দারুণ! +20 XP':'আরও বলার চেষ্টা করুন।')+' '+fx;
if(w>=15){S.xp+=20;S.sp++;head();save()}}},1000)}
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
function inst(){if(dp){dp.prompt();dp=null}else alert('Chrome-এর ৩-ডট মেনু থেকে "Add to Home screen" বা "Install app" চাপুন।')}
function sh(){const d={title:'English Shikhi',text:'সহজে ইংরেজি শিখুন — Sifat Uddin-এর অ্যাপ',url:location.href};if(navigator.share)navigator.share(d).catch(()=>{});else{try{navigator.clipboard.writeText(location.href);alert('লিংক কপি হয়েছে')}catch(e){alert(location.href)}}}
head();home();
</script>
</body>
